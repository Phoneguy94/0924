const BASE_ID="appSxuH0GH10rxd5y",TABLE_ID="tblI7llQH93Xkin3O";const F={MLB:"fldvQvP6xGTCpB71A",WebexOne:"fld7W7JS6XPIZLoMp",NBA_Card:"fldIvLhW3kR4KQXt4",FLGISA:"fldptFIDcWfVutGRP",Adventure:"fldXfWNJ2kS16Vu7L",USA250:"fldoj4Im2cUcxua5D"};const EVENTS={MLB:{label:"MLB",accent:"#2E86DE",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/mlb.png",fields:[F.MLB]},NBA:{label:"NBA",accent:"#C8102E",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/nba.png",fields:[F.NBA_Card]},FLGISA:{label:"FLGISA Florida Hero",accent:"#2ECC71",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/flgisa.png",fields:[F.FLGISA]},Adventure:{label:"Adventure Hero",accent:"#F59E0B",bg:"",fields:[F.Adventure]},WebexOne:{label:"WebexOne Austin 2026",accent:"#FFD400",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/webexone.png",fields:[F.WebexOne]},USA250:{label:"USA250",accent:"#B23A48",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/usa250.png",fields:[F.USA250]}};const ROTATE_MS=39000,MAX_WALL_ENTRIES=500,REFRESH_MS=30000,MASTER_EVENT_MS=20000,OLD="https://raw.githubusercontent.com/Phoneguy94/0924/1f7e0430f3b5655cb27dde308e47851495ed2005/event-wall/index.html";let AIRTABLE_TOKEN="",people=[],cur=0,rotateTimer=null,masterTimer=null,masterRotateOn=false,lastSig="";const params=new URLSearchParams(location.search),rawEvent=(params.get("event")||"ALL").trim(),normalized=normalizeEvent(rawEvent),isMaster=normalized==="ALL";let currentEvent=normalized;const trackEl=document.getElementById("track"),loadingEl=document.getElementById("loading"),emptyEl=document.getElementById("empty"),prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),controls=document.getElementById("controls"),eventSel=document.getElementById("eventSelect"),rotToggle=document.getElementById("rotateToggle"),titleEl=document.getElementById("title"),eyebrowEl=document.getElementById("eyebrow"),stageEl=document.getElementById("stage");
function normalizeEvent(v){v=String(v||"").toLowerCase();if(!v||v==="all")return"ALL";if(v.includes("adventure")||v.includes("comicbookhero"))return"Adventure";if(v.includes("flgisa")||v.includes("florida")||v.includes("gisa"))return"FLGISA";if(v.includes("webex"))return"WebexOne";if(v.includes("usa250")||v.includes("usa")||v.includes("america250")||v.includes("july4")||v.includes("fourth"))return"USA250";if(v.includes("nba")||v.includes("basketball")||v.includes("magic"))return"NBA";if(v.includes("mlb")||v.includes("baseball")||v.includes("pirates")||v.includes("pittsburgh"))return"MLB";return"ALL"}function esc(s){return String(s||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]))}function attUrl(a){return a&&a.thumbnails&&a.thumbnails.large&&a.thumbnails.large.url||a&&a.url||""}function newest(v){return Array.isArray(v)&&v.length?attUrl(v[v.length-1]):""}async function getToken(){const txt=await(await fetch(OLD)).text();const m=txt.match(/AIRTABLE_TOKEN\s*=\s*"([^"]+)"/);if(!m)throw new Error("Missing token");AIRTABLE_TOKEN=m[1]}function denseMode(){return currentEvent==="MLB"||currentEvent==="FLGISA"}function pageSize(){return matchMedia("(max-width:700px),(max-height:520px) and (orientation:landscape)").matches?4:10}function totalPages(){return Math.max(1,Math.ceil(people.length/pageSize()))}function applyTheme(k){const c=k==="ALL"?{label:"All Events",accent:"#2E86DE",bg:""}:EVENTS[k];document.documentElement.style.setProperty("--accent",c.accent);document.body.style.setProperty("--bg-img",c.bg?`url("${c.bg}")`:"none");eyebrowEl.textContent=`${c.label} · Live`;titleEl.innerHTML=k==="ALL"?`All <span class="accent">Events</span>`:`${esc(c.label)} <span class="accent">Wall</span>`}function claimUrl(id,k){return `https://phoneguy94.github.io/0924/claim_my_bobble/?id=${encodeURIComponent(id)}&experience=${encodeURIComponent(String(k).toLowerCase())}`}function entryFromRecord(rec,k){const cfg=EVENTS[k],f=rec.fields||{},img=ne 0?"focus":ad===1?"side":"far");const x=m?d*96:d*27,scale=m?(d===0?1:ad===1?.30:.18):(d===0?1.12:ad===1?.58:.38);node.style.transform=`translate(-50%,-50%) translateX(${x}vw) scale(${scale})`;node.style.opacity=m?(ad>1?0:d===0?1:.85):(ad>2?0:1)})}function render(){if(denseMode()){trackEl.className="dense-track";const size=pageSize(),pages=[];for(let i=0;i<people.length;i+=size)pages.push(people.slice(i,i+size));trackEl.innerHTML=pages.map(group=>`<section class="dense-page">${group.map(p=>entryHTML(p,"dense-card")).join("")}</section>`).join("");cur=Math.min(cur,totalPages()-1)}else{trackEl.className="track";trackEl.style.transform="";trackEl.innerHTML=people.map(p=>`<div class="entry">${entryHTML(p)}</div>`).join("");[...trackEl.children].forEach((node,i)=>node.onclick=()=>{if(i!==cur){cur=i;layout();restart()}});cur=Math.min(cur,Math.max(0,people.length-1))}layout()}function advance(){const n=denseMode()?totalPages():people.length;if(n>1){cur=(cur+1)%n;layout()}}function go(dir){const n=denseMode()?totalPages():people.length;if(n>1){cur=(cur+dir+n)%n;layout();restart()}}function restart(){clearInterval(rotateTimer);const n=denseMode()?totalPages():people.length;if(n>1)rotateTimer=setInterval(advance,ROTATE_MS)}prevBtn.onclick=()=>go(-1);nextBtn.onclick=()=>go(1);document.addEventListener("keydown",e=>{const tag=document.activeElement?.tagName;if(tag==="SELECT"||tag==="BUTTON"||tag==="INPUT")return;if(e.key==="ArrowLeft"){e.preventDefault();go(-1)}if(e.key==="ArrowRight"){e.preventDefault();go(1)}});let swipeStartX=0,swipeStartY=0;stageEl.addEventListener("touchstart",e=>{const t=e.changedTouches[0];swipeStartX=t.clientX;swipeStartY=t.clientY},{passive:true});stageEl.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-swipeStartX,dy=t.clientY-swipeStartY;if(Math.abs(dx)>=40&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx<0?1:-1)},{passive:true});addEventListener("resize",()=>render());function show(){loadingEl.classList.add("hidden");emptyEl.classList.toggle("hidden",people.length>0);const n=denseMode()?totalPages():people.length;prevBtn.classList.toggle("hidden",n<=1);nextBtn.classList.toggle("hidden",n<=1)}function sig(list){return(list||[]).map(p=>`${p.eventKey}|${p.createdTime}|${p.img}`).join("||")}async function load(initial){const old=sig(people),next=await fetchPeople();if(next&&next.error){if(initial)loadingEl.innerHTML=`<div class="big">Can’t reach Airtable</div><div>${esc(next.error)}</div>`;return}const nextSig=sig(next);if(!initial&&nextSig===old){show();return}const hadNew=old&&nextSig!==old;people=next||[];lastSig=nextSig;if(hadNew)cur=0;render();restart();show()}function setupMaster(){controls.classList.remove("hidden");const keys=Object.keys(EVENTS);eventSel.innerHTML=[`<option value="ALL">All Events</option>`].concat(keys.map(k=>`<option value="${k}">${EVENTS[k].label}</option>`)).join("");eventSel.value=currentEvent;eventSel.onchange=()=>{currentEvent=eventSel.value;applyTheme(currentEvent);cur=0;loadingEl.classList.remove("hidden");load(false)};rotToggle.onclick=()=>{masterRotateOn=!masterRotateOn;rotToggle.classList.toggle("on",masterRotateOn);rotToggle.textContent=`Auto-rotate: ${masterRotateOn?"on":"off"}`;clearInterval(masterTimer);if(masterRotateOn){const order=["ALL",...keys];masterTimer=setInterval(()=>{let i=order.indexOf(currentEvent);currentEvent=order[(i+1)%order.length];eventSel.value=currentEvent;applyTheme(currentEvent);cur=0;load(false)},MASTER_EVENT_MS)}}}applyTheme(currentEvent);if(isMaster)setupMaster();getToken().then(()=>{load(true);setInterval(()=>load(false),REFRESH_MS)}).catch(e=>{loadingEl.innerHTML=`<div class="big">Can’t start wall</div><div>${esc(e.message)}</div>`});
