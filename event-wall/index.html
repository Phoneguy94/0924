<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Event Wall</title><style>:root{--ink:#0b1a2b;--chalk:#f4f1e8;--gold:#e8b84b;--line:rgba(244,241,232,.14);--accent:#2e86de}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:linear-gradient(rgba(8,18,32,.76),rgba(6,15,26,.9)),var(--bg-img,none) center/cover no-repeat,#0b1a2b;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--chalk);display:flex;flex-direction:column;user-select:none}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 12% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),radial-gradient(60% 40% at 88% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%)}header{flex:0 0 auto;text-align:center;padding:1.7vh 2vw .8vh;position:relative;z-index:3}.eyebrow{font-size:1.35vh;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:.45vh}h1{font-family:Georgia,serif;font-weight:800;font-style:italic;font-size:3.8vh;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}h1 .accent{color:var(--accent)}.controls{display:flex;gap:1vw;align-items:center;justify-content:center;margin-top:.8vh}.controls.hidden{display:none}.controls select,.controls button{font:inherit;font-size:1.45vh;padding:.55vh .9vw;border-radius:9px;background:rgba(255,255,255,.08);color:var(--chalk);border:1px solid var(--line);cursor:pointer}.controls select option{color:#111}.controls button.on{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;padding:1vh 5vw 1.2vh}.track{height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.35vh 1.15vw;align-items:stretch}.entry{min-width:0;min-height:0}.card{position:relative;width:100%;height:100%;border-radius:12px;background:var(--chalk);padding:.7vh;box-shadow:0 12px 28px rgba(0,0,0,.48);overflow:hidden}.photo{width:100%;height:100%;border-radius:8px;object-fit:contain;display:block;background:#091421}.qr-overlay{position:absolute;right:1.2vh;bottom:1.2vh;width:68px;background:#fff;border-radius:7px;padding:5px;box-shadow:0 5px 18px rgba(0,0,0,.55);opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s;pointer-events:none}.card:hover .qr-overlay{opacity:1;transform:scale(1)}.qr-overlay.flgisa{width:92px}.qr-overlay img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}.qr-label{color:#111;font-size:8px;line-height:1.05;font-weight:900;text-align:center;margin-top:3px;text-transform:uppercase}.qr-label .bonus{display:block;margin-top:3px;font-size:7px;text-transform:none}.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:5.5vh;height:5.5vh;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--chalk);font-size:3vh;cursor:pointer}.nav.prev{left:1vw}.nav.next{right:1vw}.nav.hidden{display:none}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.2vh;text-align:center;z-index:60;font-size:2.1vh;color:rgba(244,241,232,.7);padding:0 8vw}.msg .big{font-family:Georgia,serif;font-style:italic;font-size:3.4vh;color:var(--chalk)}.hidden{display:none!important}footer{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:1.5vw;padding:.7vh 2vw 1.2vh;position:relative;z-index:3}.brand{font-size:1.15vh;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,241,232,.45);font-weight:700}.page{font-size:1.15vh;color:rgba(244,241,232,.6)}@media(max-width:700px),(max-height:520px) and (orientation:landscape){html,body{position:fixed;inset:0;width:100%;min-height:100%;overflow:hidden}body{height:100svh}header{padding:1.1svh 3vw .5svh}.eyebrow{font-size:1.05svh;letter-spacing:.25em}h1{font-size:2.45svh}.controls{margin-top:.55svh}.controls select,.controls button{font-size:1.1svh;padding:.45svh 1.7vw}.stage{padding:.7svh 8vw}.track{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1svh 2.5vw}.card{padding:.5svh;border-radius:9px}.photo{border-radius:6px}.qr-overlay{display:none}.nav{width:4.6svh;height:4.6svh;font-size:2.6svh}.nav.prev{left:1.5vw}.nav.next{right:1.5vw}.brand,.page{font-size:.9svh}.brand{letter-spacing:.18em}footer{padding:.45svh 2vw .8svh}}</style></head><body><header><div class="eyebrow" id="eyebrow">Live</div><h1 id="title">Event <span class="accent">Wall</span></h1><div class="controls hidden" id="controls"><select id="eventSelect"></select><button id="rotateToggle">Event rotation: off</button></div></header><div class="stage" id="stage"><button class="nav prev hidden" id="prev">‹</button><div class="track" id="track"></div><button class="nav next hidden" id="next">›</button><div class="msg" id="loading"><div class="big">Loading…</div><div>Fetching the latest demo images</div></div><div class="msg hidden" id="empty"><div class="big">No entries yet</div><div>No populated image fields found for this event</div></div></div><footer><div class="page" id="page"></div><div class="brand">Powered by Webex</div></footer><script>const BASE_ID="appSxuH0GH10rxd5y",TABLE_ID="tblI7llQH93Xkin3O",AIRTABLE_TOKEN="patYsJQ4hhojOhYuk.a0839f88a7ae231ce3bf1db6816c451efd8cc6dc7a313a99d4216dc1e557336e";const F={MLB:"fldvQvP6xGTCpB71A",WebexOne:"fld7W7JS6XPIZLoMp",NBA_Card:"fldIvLhW3kR4KQXt4",FLGISA:"fldptFIDcWfVutGRP",Adventure:"fldXfWNJ2kS16Vu7L",USA250:"fldoj4Im2cUcxua5D"};const EVENTS={MLB:{label:"MLB",accent:"#2E86DE",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/mlb.png",fields:[F.MLB]},NBA:{label:"NBA",accent:"#C8102E",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/nba.png",fields:[F.NBA_Card]},FLGISA:{label:"FLGISA Florida Hero",accent:"#2ECC71",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/flgisa.png",fields:[F.FLGISA]},Adventure:{label:"Adventure Hero",accent:"#F59E0B",bg:"",fields:[F.Adventure]},WebexOne:{label:"WebexOne Austin 2026",accent:"#FFD400",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/webexone.png",fields:[F.WebexOne]},USA250:{label:"USA250",accent:"#B23A48",bg:"https://phoneguy94.github.io/0924/VXP/assets/backgrounds/usa250.png",fields:[F.USA250]}};const ROTATE_MS=39000,REFRESH_MS=30000,MASTER_EVENT_MS=20000,MAX_WALL_ENTRIES=500;let people=[],pageIndex=0,rotateTimer=null,masterTimer=null,masterRotateOn=false;const params=new URLSearchParams(location.search),rawEvent=(params.get("event")||"ALL").trim(),normalized=normalizeEvent(rawEvent),isMaster=normalized==="ALL";let currentEvent=normalized;const trackEl=document.getElementById("track"),loadingEl=document.getElementById("loading"),emptyEl=document.getElementById("empty"),prevBtn=document.getElementById("prev"),nextBtn=document.getElementById("next"),controls=document.getElementById("controls"),eventSel=document.getElementById("eventSelect"),rotToggle=document.getElementById("rotateToggle"),titleEl=document.getElementById("title"),eyebrowEl=document.getElementById("eyebrow"),stageEl=document.getElementById("stage"),pageEl=document.getElementById("page");function normalizeEvent(v){v=String(v||"").toLowerCase();if(!v||v==="all")return"ALL";if(v.includes("adventure")||v.includes("comicbookhero"))return"Adventure";if(v.includes("flgisa")||v.includes("florida")||v.includes("gisa"))return"FLGISA";if(v.includes("webex"))return"WebexOne";if(v.includes("usa250")||v.includes("usa")||v.includes("america250")||v.includes("july4")||v.includes("fourth"))return"USA250";if(v.includes("nba")||v.includes("basketball")||v.includes("magic"))return"NBA";if(v.includes("mlb")||v.includes("baseball")||v.includes("pirates")||v.includes("pittsburgh"))return"MLB";return"ALL"}function esc(s){return String(s||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]))}function attUrl(a){return a?.thumbnails?.full?.url||a?.thumbnails?.large?.url||a?.url||""}function newest(v){return Array.isArray(v)&&v.length?attUrl(v[v.length-1]):""}function applyTheme(k){const c=k==="ALL"?{label:"All Events",accent:"#2E86DE",bg:""}:EVENTS[k];document.documentElement.style.setProperty("--accent",c.accent);document.body.style.setProperty("--bg-img",c.bg?`url("${c.bg}")`:"none");eyebrowEl.textContent=`${c.label} · Live`;titleEl.innerHTML=k==="ALL"?`All <span class="accent">Events</span>`:`${esc(c.label)} <span class="accent">Wall</span>`}function claimUrl(id,k){return`https://phoneguy94.github.io/0924/claim_my_bobble/?id=${encodeURIComponent(id)}&experience=${encodeURIComponent(String(k).toLowerCase())}`}function entryFromRecord(rec,k){const cfg=EVENTS[k],f=rec.fields||{},img=newest(f[cfg.fields[0]]);return img?{eventKey:k,img,qrUrl:claimUrl(rec.id,k),createdTime:rec.createdTime}:null}function entriesForRecord(rec){if(currentEvent!=="ALL"){const one=entryFromRecord(rec,currentEvent);return one?[one]:[]}const out=[];for(const k of Object.keys(EVENTS)){const one=entryFromRecord(rec,k);if(one)out.push(one)}return out}async function fetchPeople(){let records=[],offset="";do{const url=`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?pageSize=100&returnFieldsByFieldId=true${offset?`&offset=${encodeURIComponent(offset)}`:""}`;const res=await fetch(url,{headers:{Authorization:`Bearer ${AIRTABLE_TOKEN}`}});if(!res.ok)throw new Error(`Airtable returned ${res.status}`);const data=await res.json();records.push(...(data.records||[]));offset=data.offset||""}while(offset);records.sort((a,b)=>new Date(b.createdTime)-new Date(a.createdTime));const out=[];for(const rec of records)out.push(...entriesForRecord(rec));out.sort((a,b)=>new Date(b.createdTime)-new Date(a.createdTime));return out.slice(0,MAX_WALL_ENTRIES)}function pageSize(){return matchMedia("(max-width:700px),(max-height:520px) and (orientation:landscape)").matches?4:10}function pageCount(){return Math.max(1,Math.ceil(people.length/pageSize()))}function entryHTML(p){const qr=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(p.qrUrl)}`,isFLGISA=p.eventKey==="FLGISA",label=isFLGISA?'Claim Your Photo<span class="bonus">Plus a bonus image from 1976.</span>':'Claim Photo';return`<div class="entry"><div class="card"><img class="photo" src="${esc(p.img)}" alt=""><div class="qr-overlay${isFLGISA?' flgisa':''}"><img src="${esc(qr)}" alt=""><div class="qr-label">${label}</div></div></div></div>`}function renderPage(){const size=pageSize(),pages=pageCount();pageIndex=((pageIndex%pages)+pages)%pages;const start=pageIndex*size;trackEl.innerHTML=people.slice(start,start+size).map(entryHTML).join("");pageEl.textContent=people.length?`${pageIndex+1} / ${pages} · ${people.length} photos`:"";prevBtn.classList.toggle("hidden",pages<=1);nextBtn.classList.toggle("hidden",pages<=1)}function advance(){if(pageCount()>1){pageIndex=(pageIndex+1)%pageCount();renderPage()}}function go(dir){if(pageCount()>1){pageIndex=(pageIndex+dir+pageCount())%pageCount();renderPage();restart()}}function restart(){clearInterval(rotateTimer);if(pageCount()>1)rotateTimer=setInterval(advance,ROTATE_MS)}prevBtn.onclick=()=>go(-1);nextBtn.onclick=()=>go(1);document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});let sx=0;stageEl.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});stageEl.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1)},{passive:true});addEventListener("resize",()=>{pageIndex=0;renderPage();restart()});function sig(list){return(list||[]).map(p=>`${p.eventKey}|${p.createdTime}|${p.img}`).join("||")}async function load(initial=false){try{const old=sig(people),next=await fetchPeople();if(!initial&&sig(next)===old)return;people=next;pageIndex=0;renderPage();restart();loadingEl.classList.add("hidden");emptyEl.classList.toggle("hidden",people.length>0)}catch(e){console.error(e);loadingEl.innerHTML=`<div class="big">Can’t reach Airtable</div><div>${esc(e.message)}</div>`}}function setupMaster(){controls.classList.remove("hidden");const keys=Object.keys(EVENTS);eventSel.innerHTML=[`<option value="ALL">All Events</option>`,...keys.map(k=>`<option value="${k}">${EVENTS[k].label}</option>`)].join("");eventSel.value=currentEvent;eventSel.onchange=()=>{currentEvent=eventSel.value;applyTheme(currentEvent);loadingEl.classList.remove("hidden");load(false)};rotToggle.onclick=()=>{masterRotateOn=!masterRotateOn;rotToggle.classList.toggle("on",masterRotateOn);rotToggle.textContent=`Event rotation: ${masterRotateOn?"on":"off"}`;clearInterval(masterTimer);if(masterRotateOn){const order=["ALL",...keys];masterTimer=setInterval(()=>{const i=order.indexOf(currentEvent);currentEvent=order[(i+1)%order.length];eventSel.value=currentEvent;applyTheme(currentEvent);load(false)},MASTER_EVENT_MS)}}}applyTheme(currentEvent);if(isMaster)setupMaster();load(true);setInterval(()=>load(false),REFRESH_MS);</script></body></html>
