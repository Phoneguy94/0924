<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VXP Experience — Camera + Wall</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061326;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff}
    .combo{display:grid;grid-template-columns:minmax(330px,31vw) 1fr;width:100%;height:100%;gap:10px;padding:10px;background:linear-gradient(135deg,#061326,#0a2039)}
    .panel{position:relative;overflow:hidden;border:1px solid rgba(88,242,166,.28);border-radius:20px;background:#07182b;box-shadow:0 18px 55px rgba(0,0,0,.35)}
    .panel:before{position:absolute;z-index:3;left:18px;top:12px;font-size:12px;font-weight:800;letter-spacing:.18em;color:rgba(255,255,255,.72);pointer-events:none}
    .camera-panel:before{content:attr(data-label)}
    .wall-panel:before{content:"LIVE PICTURE WALL"}
    iframe{display:block;width:100%;height:100%;border:0;background:#061326}
    @media(max-width:900px){
      .combo{grid-template-columns:1fr;grid-template-rows:46% 54%;gap:6px;padding:6px}
      .panel{border-radius:14px}
    }
  </style>
</head>
<body>
  <main class="combo" id="combo" aria-label="VXP camera and picture wall">
    <section class="panel camera-panel" id="cameraPanel" data-label="VXP CAMERA">
      <iframe id="cameraFrame" allow="camera; autoplay" title="VXP camera"></iframe>
    </section>
    <section class="panel wall-panel">
      <iframe id="wallFrame" title="VXP picture wall"></iframe>
    </section>
  </main>
  <script>
    const allowed=['mlb','nba','flgisa','usa250'];
    const params=new URLSearchParams(location.search);
    const requested=(params.get('experience')||'flgisa').toLowerCase();
    const experience=allowed.includes(requested)?requested:'flgisa';
    const names={mlb:'MLB',nba:'NBA',flgisa:'FLGISA HERO',usa250:'USA250'};
    const label=names[experience]||'VXP';
    const cameraFrame=document.getElementById('cameraFrame');
    const wallFrame=document.getElementById('wallFrame');
    const cameraPanel=document.getElementById('cameraPanel');
    cameraPanel.dataset.label=`${label} CAMERA`;
    document.title=`${label} Experience — Camera + Wall`;
    document.getElementById('combo').setAttribute('aria-label',`${label} camera and picture wall`);
    cameraFrame.title=`${label} camera`;
    wallFrame.title=`${label} picture wall`;
    cameraFrame.src=`../camera/?experience=${encodeURIComponent(experience)}`;
    wallFrame.src=`../wall/?experience=${encodeURIComponent(experience)}`;

    cameraFrame.addEventListener('load',()=>{
      try{
        const d=cameraFrame.contentDocument;
        const style=d.createElement('style');
        style.textContent=`
          :root{--stage-w:100vw!important;--stage-h:100vh!important;--left:0px!important;--top:0px!important}
          html,body{background:#07182b!important}
          body:before{display:none!important}
          .location,.team-panel{width:90%!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important;padding:12px!important;border-radius:14px!important}
          label{font-size:clamp(14px,1.25vw,20px)!important;margin-bottom:7px!important}
          select{font-size:clamp(14px,1.1vw,19px)!important;padding:10px!important}
          .camera,.camera-wrap{width:88%!important;max-width:none!important;height:52%!important;border-width:3px!important;border-radius:16px!important}
          .status{width:90%!important;font-size:clamp(13px,1.05vw,18px)!important}
          .actions,.button-row{width:92%!important;text-align:center!important}
          button{font-size:clamp(14px,1.15vw,21px)!important;padding:11px 16px!important}
          .count,.countdown{font-size:clamp(80px,11vw,170px)!important}
          @media(max-width:900px){
            .location,.team-panel{width:92%!important}
            .camera,.camera-wrap{width:60%!important;height:56%!important}
            .actions,.button-row{width:60%!important}
          }
        `;
        d.head.appendChild(style);
      }catch(e){
        console.warn('Camera layout override could not be applied.',e);
      }
    });
  </script>
</body>
</html>
