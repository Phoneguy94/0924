<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Curl-Ribbean Camera + Live Wall</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .split{display:grid;grid-template-columns:minmax(360px,44%) minmax(0,56%);width:100%;height:100dvh;gap:3px;background:#d6a541}
    .panel{position:relative;min-width:0;min-height:0;overflow:hidden;background:#07111f}
    iframe{display:block;width:100%;height:100%;border:0;background:#07111f}
    .label{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:12px;padding:7px 11px;border:1px solid #ffffff35;border-radius:999px;background:#050711cc;color:#fff;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;backdrop-filter:blur(8px)}
    @media(max-width:800px){
      .split{grid-template-columns:1fr;grid-template-rows:minmax(390px,58%) minmax(250px,42%);gap:3px}
      .label{font-size:10px;padding:6px 9px}
    }
    @media(max-width:800px) and (orientation:landscape){
      .split{grid-template-columns:minmax(330px,48%) minmax(0,52%);grid-template-rows:1fr}
    }
  </style>
</head>
<body>
  <main class="split">
    <section class="panel" aria-label="Curl-Ribbean camera">
      <div class="label">Camera</div>
      <iframe
        src="../../../vxp/camera/?experience=curling&v=wall-button-3"
        title="Curl-Ribbean Camera"
        allow="camera; microphone; fullscreen; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
    <section class="panel" aria-label="Curl-Ribbean live photo wall">
      <div class="label">Live Wall</div>
      <iframe
        src="../wall/"
        title="Curl-Ribbean Live Wall"
        allow="fullscreen; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
  </main>
</body>
</html>
