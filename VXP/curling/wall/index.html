<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pirates of the Curl-Ribbean Wall</title>
<style>
:root{--gold:#d6a541;--ink:#090d18;--paper:#f4ead1}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at top,#26324d 0,#0a1020 46%,#050711 100%);display:flex;flex-direction:column}header{text-align:center;padding:18px 16px 10px;z-index:3}.eyebrow{color:#f3c65d;text-transform:uppercase;letter-spacing:.35em;font-weight:900;font-size:12px}h1{margin:7px 0 3px;font-family:Georgia,serif;font-size:clamp(28px,4vw,54px)}.sub{opacity:.82}.stage{position:relative;flex:1;min-height:0;overflow:hidden}.track{position:absolute;inset:0}.entry{position:absolute;left:50%;top:50%;transform-origin:center;transition:transform .55s ease,opacity .55s ease,filter .55s ease}.card{height:min(72vh,760px);max-width:78vw;border:8px solid var(--paper);border-radius:14px;overflow:hidden;background:#111;box-shadow:0 24px 70px #000b}.card.portrait{aspect-ratio:1/2}.card.landscape{aspect-ratio:3/2}.composite{position:relative;width:100%;height:100%;overflow:hidden;background:#080a12}.photo,.overlay{position:absolute;inset:0;width:100%;height:100%;display:block}.photo{object-fit:cover}.overlay{object-fit:fill;pointer-events:none}.focus{z-index:10}.side{z-index:5;filter:brightness(.72)}.far{z-index:1;filter:brightness(.45)}button{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff44;background:#0008;color:#fff;font-size:34px;cursor:pointer}.prev{left:3vw}.next{right:3vw}.hidden{display:none!important}.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:22px;color:#ffffffbb}.footer{text-align:center;padding:9px 16px 16px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.55}@media(max-width:700px){header{padding-top:8px;padding-bottom:4px}.eyebrow{font-size:10px;letter-spacing:.24em}h1{font-size:25px;margin-top:4px}.sub{font-size:13px}.card{height:auto;width:min(86vw,430px);max-height:62svh}.card.portrait{aspect-ratio:1/2}.card.landscape{aspect-ratio:3/2}.composite{width:100%;height:100%}.photo,.overlay{width:100%;height:100%;object-fit:fill}.prev{left:8px}.next{right:8px}.footer{padding:5px 10px 9px;font-size:9px}}
</style>
</head>
<body>
<header><div class="eyebrow">Orlando Curling Club · Live</div><h1>Pirates of the Curl-Ribbean</h1><div class="sub">July 31 – August 2, 2026</div></header>
<section class="stage" id="stage"><button class="prev hidden" id="prev">‹</button><div class="track" id="track"></div><button class="next hidden" id="next">›</button><div class="msg" id="loading">Loading the latest Curl-Ribbean photos…</div><div class="msg hidden" id="empty">No Curling photos are in the selected Airtable field yet.</div></section>
<div class="footer">Powered by Veytec + Webex</div>
<script src="../../../vxp/config/experiences.js"></script>
<script>
const cfg=window.VXP_CONFIG,FIELD='fldgHqBtzd9ujy4oB',PORTRAIT='../assets/pirates-overlay-portrait.png',LANDSCAPE='../assets/pirates-overlay-landscape.png',track=document.getElementById('track'),loading=document.getElementById('loading'),empty=document.getElementById('empty'),prev=document.getElementById('prev'),next=document.getElementById('next');let photos=[],cur=0,timer;
function attachmentUrl(a){return a?.thumbnails?.large?.url||a?.url||''}
async function fetchPhotos(){let records=[],offset='';do{const url=`https://api.airtable.com/v0/${cfg.airtable.baseId}/${cfg.airtable.tableId}?pageSize=100&returnFieldsByFieldId=true${offset?`&offset=${encodeURIComponent(offset)}`:''}`;const r=await fetch(url,{headers:{Authorization:`Bearer ${cfg.airtable.token}`}});if(!r.ok)throw new Error(`Airtable returned ${r.status}`);const d=await r.json();records.push(...(d.records||[]));offset=d.offset||''}while(offset);records.sort((a,b)=>new Date(b.createdTime)-new Date(a.createdTime));return records.flatMap(r=>{const v=r.fields?.[FIELD];return Array.isArray(v)?v.map(a=>({url:attachmentUrl(a),created:r.createdTime})).filter(x=>x.url):[]}).slice(0,100)}
function layout(){const nodes=[...track.children],n=nodes.length;nodes.forEach((node,i)=>{let d=i-cur;if(n>2){if(d>n/2)d-=n;if(d<-n/2)d+=n}const ad=Math.abs(d);node.className='entry '+(d===0?'focus':ad===1?'side':'far');node.style.transform=`translate(-50%,-50%) translateX(${d*30}vw) scale(${d===0?1:ad===1?.58:.36})`;node.style.opacity=ad>2?0:1})}
function setOrientation(img){const card=img.closest('.card'),overlay=card.querySelector('.overlay'),portrait=img.naturalHeight>=img.naturalWidth;card.classList.add(portrait?'portrait':'landscape');overlay.src=portrait?PORTRAIT:LANDSCAPE}
function render(){track.innerHTML=photos.map(p=>`<div class="entry"><div class="card"><div class="composite"><img class="photo" src="${p.url}" alt="Curl-Ribbean photo" onload="setOrientation(this)"><img class="overlay" alt="Pirates of the Curl-Ribbean overlay"></div></div></div>`).join('');[...track.children].forEach((n,i)=>n.onclick=()=>{cur=i;layout();restart()});layout();loading.classList.add('hidden');empty.classList.toggle('hidden',photos.length>0);prev.classList.toggle('hidden',photos.length<2);next.classList.toggle('hidden',photos.length<2)}
function go(d){if(photos.length<2)return;cur=(cur+d+photos.length)%photos.length;layout();restart()}function restart(){clearInterval(timer);if(photos.length>1)timer=setInterval(()=>go(1),10000)}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});let sx=0;document.getElementById('stage').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1)},{passive:true});
async function load(){try{photos=await fetchPhotos();cur=0;render();restart()}catch(e){console.error(e);loading.textContent=`Unable to load Airtable: ${e.message}`}}load();setInterval(load,cfg.airtable.refreshMs||30000);
</script>
</body>
</html>
