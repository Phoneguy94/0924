<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NFL Wall</title>
<style>
:root{--accent:#34d399;--ink:#07111f;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#fff}body{background:radial-gradient(circle at 20% 0%,rgba(52,211,153,.2),transparent 35%),radial-gradient(circle at 85% 15%,rgba(59,130,246,.18),transparent 35%),linear-gradient(180deg,#07111f,#020617)}header{text-align:center;padding:20px 16px 8px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(34px,6vw,64px);margin:6px 0 0;line-height:1}.stage{height:calc(100% - 120px);position:relative;overflow:hidden}.track{position:absolute;inset:0}.entry{position:absolute;left:50%;top:50%;transform-origin:center;transition:transform .55s ease,opacity .55s ease,filter .55s ease}.card{height:min(70vh,720px);aspect-ratio:3/4;background:#fff;border-radius:18px;padding:10px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.6)}.card img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}.focus{z-index:10}.side{z-index:5;filter:brightness(.75)}.far{z-index:2;filter:brightness(.45)}.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;font-size:36px;cursor:pointer}.prev{left:24px}.next{right:24px}.hidden{display:none!important}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;opacity:.8;padding:30px}.brand{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.45}@media(max-width:700px){header{padding-top:14px}.stage{height:calc(100% - 95px)}.card{height:auto;width:min(72vw,42vh)}.nav{width:46px;height:46px;font-size:28px}.prev{left:10px}.next{right:10px}}
</style></head><body>
<header><div class="eyebrow">NFL · Live</div><h1>Legendary Moments</h1></header><main class="stage" id="stage"><button class="nav prev hidden" id="prev">‹</button><div class="track" id="track"></div><button class="nav next hidden" id="next">›</button><div class="message" id="message">Loading the latest NFL moments…</div></main><div class="brand">Powered by Veytec + Webex</div>
<script src="../../vxp/config/experiences.js"></script><script>
const cfg=window.VXP_CONFIG,exp=cfg.experiences.nfl,track=document.getElementById('track'),message=document.getElementById('message'),prev=document.getElementById('prev'),next=document.getElementById('next');let items=[],cur=0,timer=null;
function imageUrl(v){if(!Array.isArray(v)||!v.length)return'';const a=v[v.length-1];return a?.thumbnails?.large?.url||a?.url||''}
async function load(){try{let all=[],offset='';do{const url=`https://api.airtable.com/v0/${cfg.airtable.baseId}/${cfg.airtable.tableId}?pageSize=100&returnFieldsByFieldId=true${offset?`&offset=${encodeURIComponent(offset)}`:''}`;const r=await fetch(url,{headers:{Authorization:`Bearer ${cfg.airtable.token}`}});if(!r.ok)throw new Error(`Airtable ${r.status}`);const d=await r.json();all=all.concat(d.records||[]);offset=d.offset||''}while(offset);items=all.map(r=>({url:imageUrl((r.fields||{})[exp.fields[0]]),created:r.createdTime})).filter(x=>x.url).sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,500);render()}catch(e){console.error(e);message.textContent='Unable to load the NFL wall right now.'}}
function render(){track.innerHTML=items.map(x=>`<div class="entry"><div class="card"><img src="${x.url}" alt="NFL moment"></div></div>`).join('');message.classList.toggle('hidden',items.length>0);if(!items.length){message.textContent='No NFL moments yet.';return}prev.classList.toggle('hidden',items.length<2);next.classList.toggle('hidden',items.length<2);[...track.children].forEach((n,i)=>n.onclick=()=>{cur=i;layout();restart()});cur=Math.min(cur,items.length-1);layout();restart()}
function layout(){const n=items.length,m=matchMedia('(max-width:700px)').matches;[...track.children].forEach((node,i)=>{let d=i-cur;if(n>2){if(d>n/2)d-=n;if(d<-n/2)d+=n}const a=Math.abs(d);node.className='entry '+(d===0?'focus':a===1?'side':'far');const x=m?d*78:d*28,scale=m?(d===0?1:a===1?.34:.18):(d===0?1.08:a===1?.6:.38);node.style.transform=`translate(-50%,-50%) translateX(${x}vw) scale(${scale})`;node.style.opacity=a>2?0:1})}
function go(d){if(items.length>1){cur=(cur+d+items.length)%items.length;layout();restart()}}function restart(){clearInterval(timer);if(items.length>1)timer=setInterval(()=>go(1),30000)}prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});let sx=0;document.getElementById('stage').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx>0?-1:1)},{passive:true});load();setInterval(load,cfg.airtable.refreshMs||30000);
</script></body></html>
