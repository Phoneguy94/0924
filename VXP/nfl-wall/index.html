<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NFL Wall</title>
<style>
:root{--accent:#34d399;--line:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#07111f;color:#fff}body{background:radial-gradient(circle at 20% 0%,rgba(52,211,153,.2),transparent 35%),radial-gradient(circle at 85% 15%,rgba(59,130,246,.18),transparent 35%),linear-gradient(180deg,#07111f,#020617);display:flex;flex-direction:column}header{text-align:center;padding:14px 16px 8px;flex:0 0 auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(30px,5vw,58px);margin:4px 0 0;line-height:1}.stage{flex:1;position:relative;overflow:hidden;padding:0 5.5vw 10px}.track{height:100%;display:flex;transition:transform .7s cubic-bezier(.22,.61,.36,1)}.page{min-width:100%;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.15vw;padding:.7vh .5vw}.card{min-width:0;min-height:0;background:#fff;border-radius:13px;padding:6px;box-shadow:0 14px 32px rgba(0,0,0,.45);overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.48);color:#fff;font-size:32px;cursor:pointer}.prev{left:12px}.next{right:12px}.hidden{display:none!important}.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;opacity:.8;padding:30px}.brand{text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.45;padding:4px 10px 10px;flex:0 0 auto}@media(max-width:700px){header{padding-top:10px}h1{font-size:28px}.stage{padding:0 11vw 6px}.page{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;padding:6px}.nav{width:42px;height:42px;font-size:26px}.prev{left:5px}.next{right:5px}.brand{font-size:9px;padding-bottom:7px}}
</style></head><body>
<header><div class="eyebrow">NFL · Live</div><h1>Legendary Moments</h1></header><main class="stage" id="stage"><button class="nav prev hidden" id="prev">‹</button><div class="track" id="track"></div><button class="nav next hidden" id="next">›</button><div class="message" id="message">Loading the latest NFL moments…</div></main><div class="brand">Powered by Veytec + Webex</div>
<script src="../../vxp/config/experiences.js"></script><script>
const cfg=window.VXP_CONFIG,exp=cfg.experiences.nfl,track=document.getElementById('track'),message=document.getElementById('message'),prev=document.getElementById('prev'),next=document.getElementById('next');let items=[],page=0,timer=null,lastSig='';
function imageUrl(v){if(!Array.isArray(v)||!v.length)return'';const a=v[v.length-1];return a?.thumbnails?.large?.url||a?.url||''}
function pageSize(){return matchMedia('(max-width:700px)').matches?4:10}
function totalPages(){return Math.max(1,Math.ceil(items.length/pageSize()))}
function signature(v){return v.map(x=>x.url).join('|')}
async function fetchItems(){let all=[],offset='';do{const url=`https://api.airtable.com/v0/${cfg.airtable.baseId}/${cfg.airtable.tableId}?pageSize=100&returnFieldsByFieldId=true${offset?`&offset=${encodeURIComponent(offset)}`:''}`;const r=await fetch(url,{headers:{Authorization:`Bearer ${cfg.airtable.token}`}});if(!r.ok)throw new Error(`Airtable ${r.status}`);const d=await r.json();all=all.concat(d.records||[]);offset=d.offset||''}while(offset);return all.map(r=>({url:imageUrl((r.fields||{})[exp.fields[0]]),created:r.createdTime})).filter(x=>x.url).sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,500)}
function render(){const size=pageSize(),pages=[];for(let i=0;i<items.length;i+=size)pages.push(items.slice(i,i+size));track.innerHTML=pages.map(group=>`<section class="page">${group.map(x=>`<div class="card"><img src="${x.url}" alt="NFL moment"></div>`).join('')}</section>`).join('');page=Math.min(page,totalPages()-1);layout();message.classList.toggle('hidden',items.length>0);if(!items.length)message.textContent='No NFL moments yet.';prev.classList.toggle('hidden',totalPages()<2);next.classList.toggle('hidden',totalPages()<2);restart()}
function layout(){track.style.transform=`translateX(${-page*100}%)`}
function go(d){if(totalPages()<2)return;page=(page+d+totalPages())%totalPages();layout();restart()}
function restart(){clearInterval(timer);if(totalPages()>1)timer=setInterval(()=>{page=(page+1)%totalPages();layout()},39000)}
async function load(){try{const nextItems=await fetchItems(),sig=signature(nextItems);if(sig===lastSig)return;const hadNew=lastSig&&sig!==lastSig;items=nextItems;lastSig=sig;if(hadNew)page=0;render()}catch(e){console.error(e);message.textContent='Unable to load the NFL wall right now.'}}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});let sx=0;document.getElementById('stage').addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)go(dx>0?-1:1)},{passive:true});addEventListener('resize',()=>render());load();setInterval(load,cfg.airtable.refreshMs||30000);
</script></body></html>
